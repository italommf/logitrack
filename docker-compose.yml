services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: logitrack
      POSTGRES_USER: logitrack
      POSTGRES_PASSWORD: logitrack
    ports:
      - "5432:5432"
    volumes:
      # Os scripts desta pasta rodam em ordem alfabética na primeira vez que o banco é criado.
      - ./database:/docker-entrypoint-initdb.d
